<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" shape-rendering="crispEdges">
  <defs>
    <pattern id="ground-dither" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#17191c"/>
      <rect x="0" y="0" width="4" height="4" fill="#24272a"/>
      <rect x="8" y="8" width="4" height="4" fill="#202326"/>
    </pattern>
    <pattern id="mountain-dither" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#292c2f"/>
      <rect x="0" y="4" width="4" height="4" fill="#3b3e40"/>
      <rect x="8" y="12" width="4" height="4" fill="#101214"/>
    </pattern>
    <pattern id="roof-dither" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#383b3d"/>
      <rect x="0" y="0" width="4" height="4" fill="#55585a"/>
      <rect x="8" y="8" width="4" height="4" fill="#242628"/>
    </pattern>
    <pattern id="rain" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="4" height="8" fill="#bfc0bc" opacity=".12"/>
      <rect x="20" y="18" width="4" height="8" fill="#bfc0bc" opacity=".1"/>
    </pattern>
  </defs>

  <!-- Eight-pixel grid, five-value monochrome palette. -->
  <rect width="1200" height="560" fill="url(#ground-dither)"/>

  <!-- Karst mountain rim, north and east. -->
  <path d="M0 0H1200V64H1168V80H1128V64H1096V88H1056V72H1016V96H976V72H936V88H896V64H856V88H816V64H776V80H736V56H696V80H656V56H616V88H576V64H536V88H496V64H456V96H416V72H376V88H336V64H296V88H256V64H216V80H176V56H136V80H96V64H56V88H0Z" fill="url(#mountain-dither)"/>
  <path d="M1200 40H1168V72H1136V104H1160V136H1128V168H1152V200H1120V232H1144V264H1112V296H1136V328H1104V360H1128V392H1096V424H1120V456H1088V488H1112V520H1080V560H1200Z" fill="url(#mountain-dither)"/>
  <g fill="#090a0b">
    <path d="M24 64h24V40h16v24h24v24H24z"/><path d="M104 72h24V40h16v32h24v24h-64z"/>
    <path d="M184 64h24V32h16v32h24v24h-64z"/><path d="M920 64h24V32h16v32h24v24h-64z"/>
    <path d="M1000 72h24V40h16v32h24v24h-64z"/><path d="M1104 192h24v-32h16v32h24v24h-64z"/>
    <path d="M1080 304h24v-40h16v40h24v24h-64z"/><path d="M1064 448h24v-32h16v32h24v24h-64z"/>
  </g>

  <!-- Main wet roads are stepped polygons, not antialiased paths. -->
  <g fill="#606366">
    <path d="M560 72H640V120H624V160H600V208H576V248H552V304H512V248H528V208H552V160H568V120H560Z"/>
    <path d="M160 448H208V424H232V392H256V376H480V336H512V264H552V336H528V416H272V432H248V464H224V496H160Z"/>
    <path d="M528 248H848V264H872V304H848V336H824V376H1048V424H800V400H760V376H528Z"/>
    <path d="M480 376H824V424H480Z"/>
    <path d="M208 392H256V368H304V344H352V320H400V296H448V272H512V320H472V336H424V360H376V384H328V408H280V432H232Z"/>
    <path d="M552 272H616V296H664V320H712V344H760V368H808V392H856V416H904V440H1008V488H888V464H840V440H792V416H744V392H696V368H648V344H600V320H552Z"/>
  </g>
  <g fill="#9a9b97">
    <rect x="588" y="80" width="8" height="144"/>
    <rect x="524" y="272" width="8" height="128"/>
    <rect x="264" y="392" width="240" height="8"/>
    <rect x="552" y="272" width="288" height="8"/>
    <rect x="504" y="392" width="288" height="8"/>
    <rect x="824" y="392" width="216" height="8"/>
    <path d="M216 416h40v-16h48v-24h48v-24h48v-24h48v-24h48v-16h8v24h-40v16h-48v24h-48v24h-48v24h-48v24h-40z"/>
    <path d="M560 288h40v16h48v24h48v24h48v24h48v24h48v24h48v24h48v24h104v8H888v-24h-48v-24h-48v-24h-48v-24h-48v-24h-48v-24h-48v-24h-40z"/>
  </g>
  <g fill="#d0d0cb" opacity=".46">
    <rect x="184" y="456" width="32" height="4"/><rect x="280" y="396" width="48" height="4"/>
    <rect x="488" y="396" width="64" height="4"/><rect x="648" y="276" width="56" height="4"/>
    <rect x="800" y="396" width="56" height="4"/><rect x="936" y="444" width="64" height="4"/>
  </g>

  <!-- Dense city blocks. -->
  <g stroke="#0a0b0c" stroke-width="8" fill="url(#roof-dither)">
    <path d="M40 120H176V208H40Z"/><path d="M200 112H336V200H200Z"/>
    <path d="M48 240H184V328H48Z"/><path d="M208 232H368V320H208Z"/>
    <path d="M56 344H176V416H56Z"/><path d="M304 432H464V528H304Z"/>
    <path d="M360 104H480V184H360Z"/><path d="M376 208H480V296H376Z"/>
    <path d="M352 336H456V376H352Z"/><path d="M648 112H768V200H648Z"/>
    <path d="M792 112H912V208H792Z"/><path d="M632 216H752V256H632Z"/>
    <path d="M648 304H760V368H648Z"/><path d="M856 232H968V328H856Z"/>
    <path d="M888 104H1008V208H888Z"/><path d="M728 432H848V528H728Z"/>
    <path d="M864 424H944V528H864Z"/>
  </g>
  <g fill="#8f9191">
    <rect x="52" y="132" width="112" height="8"/><rect x="212" y="124" width="112" height="8"/>
    <rect x="60" y="252" width="112" height="8"/><rect x="220" y="244" width="136" height="8"/>
    <rect x="372" y="116" width="96" height="8"/><rect x="660" y="124" width="96" height="8"/>
    <rect x="804" y="124" width="96" height="8"/><rect x="900" y="116" width="96" height="8"/>
  </g>

  <!-- Ten landmark footprints align with the interactive coordinates. -->
  <!-- Water tower: 50%, 15%. -->
  <g transform="translate(576 52)" stroke="#08090a" stroke-width="4">
    <rect x="0" y="0" width="48" height="20" fill="#b9bab6"/>
    <rect x="8" y="20" width="32" height="16" fill="#777a7b"/>
    <rect x="8" y="36" width="8" height="32" fill="#a3a4a0"/><rect x="32" y="36" width="8" height="32" fill="#a3a4a0"/>
    <rect x="4" y="52" width="40" height="8" fill="#505355"/>
  </g>
  <!-- Upscale apartment: 46%, 39%. -->
  <g transform="translate(516 184)" stroke="#08090a" stroke-width="4">
    <path d="M0 64V8H72V64Z" fill="#6d7072"/><rect x="8" y="16" width="12" height="12" fill="#d1d1cc"/>
    <rect x="28" y="16" width="12" height="12" fill="#d1d1cc"/><rect x="48" y="16" width="12" height="12" fill="#d1d1cc"/>
    <rect x="28" y="40" width="16" height="24" fill="#202225"/>
  </g>
  <!-- Player apartment: 44%, 50%. -->
  <g transform="translate(492 248)" stroke="#08090a" stroke-width="4">
    <path d="M0 56V16L36 0L72 16V56Z" fill="#878988"/>
    <rect x="12" y="20" width="12" height="12" fill="#303335"/><rect x="48" y="20" width="12" height="12" fill="#303335"/>
    <rect x="28" y="36" width="16" height="20" fill="#202225"/>
  </g>
  <!-- Community hospital: 69%, 50%. -->
  <g transform="translate(788 244)" stroke="#08090a" stroke-width="4">
    <rect x="0" y="8" width="80" height="64" fill="#747779"/>
    <rect x="32" y="0" width="16" height="44" fill="#d2d2cd"/><rect x="16" y="16" width="48" height="16" fill="#d2d2cd"/>
  </g>
  <!-- Convenience store: 20%, 71%. -->
  <g transform="translate(200 372)" stroke="#08090a" stroke-width="4">
    <rect x="0" y="8" width="80" height="48" fill="#7a7d7e"/><rect x="8" y="0" width="64" height="16" fill="#b6b7b3"/>
    <rect x="8" y="28" width="24" height="20" fill="#d0d0cb"/><rect x="44" y="28" width="24" height="20" fill="#303234"/>
  </g>
  <!-- Old residential building: 17%, 85%. -->
  <g transform="translate(164 440)" stroke="#08090a" stroke-width="4">
    <rect x="0" y="0" width="80" height="72" fill="#56595b"/>
    <g fill="#a8a9a5"><rect x="8" y="12" width="12" height="12"/><rect x="32" y="12" width="12" height="12"/><rect x="56" y="12" width="12" height="12"/><rect x="8" y="36" width="12" height="12"/><rect x="56" y="36" width="12" height="12"/></g>
    <rect x="32" y="44" width="16" height="28" fill="#1b1d1f"/>
  </g>
  <!-- Middle school: 43%, 71%. -->
  <g transform="translate(468 360)" stroke="#08090a" stroke-width="4">
    <rect x="0" y="20" width="96" height="48" fill="#747779"/><rect x="8" y="0" width="80" height="24" fill="#a2a3a0"/>
    <g fill="#d0d0cb"><rect x="12" y="32" width="12" height="12"/><rect x="34" y="32" width="12" height="12"/><rect x="56" y="32" width="12" height="12"/><rect x="76" y="32" width="12" height="12"/></g>
  </g>
  <!-- Mountain trail: 67%, 71%. -->
  <g transform="translate(768 360)" fill="#aaa" stroke="#08090a" stroke-width="4">
    <rect x="0" y="0" width="72" height="12"/><rect x="8" y="16" width="64" height="12"/><rect x="16" y="32" width="56" height="12"/><rect x="24" y="48" width="48" height="12"/><rect x="32" y="64" width="40" height="12"/>
  </g>
  <!-- Observation deck: 88%, 69%. -->
  <g transform="translate(1016 352)" stroke="#08090a" stroke-width="4" fill="#858786">
    <rect x="0" y="36" width="80" height="12"/><rect x="8" y="0" width="64" height="8"/>
    <rect x="12" y="8" width="8" height="28"/><rect x="60" y="8" width="8" height="28"/><rect x="24" y="20" width="32" height="8"/>
  </g>
  <!-- Old inn: 82%, 85%. -->
  <g transform="translate(944 440)" stroke="#08090a" stroke-width="4">
    <path d="M0 64V16H80V64Z" fill="#686b6c"/><path d="M8 16L20 0H60L72 16Z" fill="#a0a19e"/>
    <rect x="12" y="28" width="20" height="16" fill="#bfc0bc"/><rect x="48" y="28" width="20" height="16" fill="#bfc0bc"/><rect x="34" y="44" width="16" height="20" fill="#202225"/>
  </g>

  <!-- Pixel puddles and rain keep the map tied to the game's storm. -->
  <g fill="#bfc0bc" opacity=".22">
    <rect x="96" y="352" width="64" height="4"/><rect x="112" y="348" width="32" height="4"/>
    <rect x="392" y="424" width="72" height="4"/><rect x="408" y="420" width="40" height="4"/>
    <rect x="624" y="288" width="56" height="4"/><rect x="640" y="284" width="24" height="4"/>
    <rect x="872" y="336" width="64" height="4"/><rect x="888" y="332" width="32" height="4"/>
  </g>
  <rect width="1200" height="560" fill="url(#rain)"/>
</svg>
